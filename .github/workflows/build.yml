name: build

on:
  push:
    branches:
      - '**'
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: chiseledBuild (Forge 1.20.1 + NeoForge 1.21.1)
    runs-on: ubuntu-latest
    timeout-minutes: 60

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17 and 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: |
            17
            21

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Build both loaders
        run: >
          ./gradlew chiseledBuild
          --stacktrace
          -Porg.gradle.java.installations.fromEnv=JAVA_HOME_17_X64,JAVA_HOME_21_X64

      - name: Verify both jars were produced
        run: |
          set -e
          forge=$(find build/libs -name 'mobends-1.20.1-*-forge.jar' | head -1)
          neoforge=$(find build/libs -name 'mobends-1.21.1-*-neoforge.jar' | head -1)
          [ -n "$forge" ] || { echo "::error::Forge jar missing"; exit 1; }
          [ -n "$neoforge" ] || { echo "::error::NeoForge jar missing"; exit 1; }
          echo "forge:    $forge"
          echo "neoforge: $neoforge"

      - name: Upload jars
        uses: actions/upload-artifact@v4
        with:
          name: mobends-jars
          path: build/libs/*/*/*.jar
          if-no-files-found: error
          retention-days: 14
