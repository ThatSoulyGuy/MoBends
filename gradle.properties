# Sets default memory used for gradle commands. Can be overridden by user or command line properties.
# This is required to provide enough memory for the Minecraft decompilation process.
org.gradle.jvmargs=-Xmx5G
org.gradle.daemon=false

# Mod Properties
mod_id=mobends
mod_name=Mo' Bends
mod_license=MIT
mod_version=4.0.2
mod_authors=GoblinBob, ThatSoulyGuy
mod_description=If you think that Minecraft characters could be more realistic, instead of steady and rigid animations, this mod is just for you! Mo' Bends adds a variety of different player animations including epic sword animations! NOW IN MINECRAFT 1.21.1!

# Minecraft/NeoForge Properties
minecraft_version=1.21.1
minecraft_version_range=[1.21.1,1.22)
neoforge_version=21.1.77
neoforge_version_range=[21.1,)
loader_version_range=[4,)
