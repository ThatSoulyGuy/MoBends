# Sets default memory used for gradle commands. Can be overridden by user or command line properties.
org.gradle.jvmargs=-Xmx5G
org.gradle.daemon=false
org.gradle.parallel=true

# Java toolchain configuration - auto-download if needed
org.gradle.java.installations.auto-detect=true
org.gradle.java.installations.auto-download=true

# Mod Properties
mod_id=mobends
mod_name=Mo' Bends
mod_license=MIT
mod_version=5.1.0
mod_authors=GoblinBob, ThatSoulyGuy
mod_description=If you think that Minecraft characters could be more realistic, instead of steady and rigid animations, this mod is just for you! Mo' Bends adds a variety of different player animations including epic sword animations!
mod_group=com.thatsoulyguy

# Architectury
architectury_neoforge_version=13.0.8
architectury_forge_version=9.2.14
enabled_platforms=neoforge,forge

# NeoForge 1.21.1 (Java 21)
neoforge_minecraft_version=1.21.1
neoforge_minecraft_version_range=[1.21.1,1.22)
neoforge_version=21.1.77
neoforge_version_range=[21.1,)
neoforge_loader_version_range=[4,)

# Forge 1.20.1 (Java 17)
forge_minecraft_version=1.20.1
forge_minecraft_version_range=[1.20.1,1.21)
forge_version=47.2.0
forge_version_range=[47,)
forge_loader_version_range=[47,)

# Modern UI (optional dependency)
modernui_forge_version=3.9.0.4
modernui_neoforge_version=3.11.1.4

# Curios (optional dependency for accessory slot compatibility)
curios_forge_file_id=6418456
curios_neoforge_file_id=6529130
