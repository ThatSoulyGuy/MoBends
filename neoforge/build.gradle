// NeoForge 1.21.1 platform module

plugins {
    id 'dev.architectury.loom'
    id 'architectury-plugin'
    id 'com.github.johnrengelman.shadow'
}

base {
    archivesName = "MoBends-neoforge-${neoforge_minecraft_version}"
}

architectury {
    platformSetupLoomIde()
    neoForge()
}

loom {
    accessWidenerPath = project(':common-mc-1.21').loom.accessWidenerPath

    runs.configureEach {
        // Include common-mc classes on the mixin classpath for dev runs
        property "mixin.env.remapRefMap", "true"
        property "mixin.env.refMapRemappingFile", "${project.projectDir}/build/createSrgToMcp/output.srg"
    }
}

java {
    toolchain {
        languageVersion = JavaLanguageVersion.of(21)
    }
}

configurations {
    common
    shadowCommon
    compileClasspath.extendsFrom common
    runtimeClasspath.extendsFrom common
    developmentNeoForge.extendsFrom common
}

repositories {
    mavenCentral()
    maven {
        name = 'CurseMaven'
        url = 'https://cursemaven.com'
        content {
            includeGroup 'curse.maven'
        }
    }
}

dependencies {
    // Minecraft
    minecraft "com.mojang:minecraft:${neoforge_minecraft_version}"
    mappings loom.officialMojangMappings()
    neoForge "net.neoforged:neoforge:${neoforge_version}"

    // Architectury API
    modApi "dev.architectury:architectury-neoforge:${architectury_neoforge_version}"

    // Modern UI (required dependency, project ID 352491, file ID 5977413 = 1.21.1-3.11.1.4)
    modImplementation "curse.maven:modern-ui-352491:5977413"

    // Modern UI's runtime dependency - Caffeine is used for text layout caching
    // Add to local runtime for development
    forgeRuntimeLibrary("com.github.ben-manes.caffeine:caffeine:3.2.0") { transitive = false }

    // Curios API (optional dependency for accessory slot compatibility)
    // Project ID 309927, file ID from gradle.properties
    modCompileOnly "curse.maven:curios-309927:${curios_neoforge_file_id}"

    // Common modules
    common(project(path: ':common-mc-1.21', configuration: 'namedElements')) { transitive = false }
    shadowCommon(project(path: ':common-mc-1.21', configuration: 'transformProductionNeoForge')) { transitive = false }
    common(project(path: ':common')) { transitive = false }
    shadowCommon(project(path: ':common')) { transitive = false }

    // UI abstraction interfaces
    common(project(path: ':gui-api')) { transitive = false }
    shadowCommon(project(path: ':gui-api')) { transitive = false }
}

processResources {
    inputs.property 'version', project.version

    filesMatching('META-INF/neoforge.mods.toml') {
        expand(
            mod_id: mod_id,
            mod_name: mod_name,
            mod_version: mod_version,
            mod_authors: mod_authors,
            mod_description: mod_description,
            mod_license: mod_license,
            minecraft_version_range: neoforge_minecraft_version_range,
            neoforge_version_range: neoforge_version_range,
            loader_version_range: neoforge_loader_version_range
        )
    }
}

shadowJar {
    exclude 'fabric.mod.json'
    exclude 'architectury.common.json'

    configurations = [project.configurations.shadowCommon]
    archiveClassifier = 'dev-shadow'
}

remapJar {
    input.set shadowJar.archiveFile
    dependsOn shadowJar
    archiveClassifier = null
}

jar {
    archiveClassifier = 'dev'
}

sourcesJar {
    duplicatesStrategy = DuplicatesStrategy.EXCLUDE
    def commonSources = project(':common-mc-1.21').sourcesJar
    def coreSources = project(':common').sourcesJar
    def guiApiSources = project(':gui-api').sourcesJar
    dependsOn commonSources, coreSources, guiApiSources
    from commonSources.archiveFile.map { zipTree(it) }
    from coreSources.archiveFile.map { zipTree(it) }
    from guiApiSources.archiveFile.map { zipTree(it) }
}

components.java {
    withVariantsFromConfiguration(project.configurations.shadowRuntimeElements) {
        skip()
    }
}

publishing {
    publications {
        mavenNeoForge(MavenPublication) {
            artifactId = "mobends-neoforge-${neoforge_minecraft_version}"
            from components.java
        }
    }
}
